[project]
name = "testclient-bridge"
version = "0.2.0"
description = "MCP bridge to 1C:Enterprise test client — UI automation, diagnostics, RAG metadata index"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["mcp>=1.9.0", "websockets>=12.0", "pydantic>=2.0"]

[project.optional-dependencies]
screenshot = ["mss>=9.0.0"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
testclient-bridge = "mcp_1c.server:main"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_1c"]
