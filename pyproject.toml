[project]
name = "answer42"
version = "0.4.42"
description = "Answer42 — The Answer to Life, Universe, and 1C — UI Driver. MCP-powered 1C:Enterprise UI automation: click, fill, navigate, test, and introspect managed forms through the test-client API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["mcp>=2.0.0,<3", "websockets>=12.0", "pydantic>=2.0"]
keywords = ["mcp", "1c", "1c-enterprise", "ui-automation", "test-client"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
]
license = {text = "MIT"}
authors = [
    {name = "Kosolapov Stanislav (proDOOMman)", email = "prodoomman@gmail.com"},
    {name = "Marvin (AI Assistant)"},
    {name = "42Clouds"},
    {name = "and contributors"},
]

[project.optional-dependencies]
screenshot = ["mss>=9.0.0"]
dev = ["pytest>=8.0", "ruff>=0.5"]
linux-window-control = ["python-xlib>=0.33"]
windows-window-control = ["pywin32>=306"]
window-control = ["python-xlib>=0.33"]

[project.scripts]
answer42 = "mcp_1c.server:main"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
lint.ignore = [
    "BLE001",
    "DTZ003",
    "DTZ005",
    "DTZ007",
    "DTZ901",
    "LOG015",
    "PLW1510",
    "S110",
    "S112",
    "TRY004",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_1c"]
artifacts = ["src/mcp_1c/assets/*.cf", "src/mcp_1c/assets/skills/**"]

[tool.hatch.build.targets.sdist]
include = [
    "src/mcp_1c",
    "src/cf",
    "src/client_cf",
    "scripts",
    "README.md",
    "LICENSE",
    "docs",
    "credentials.example.json",
]
