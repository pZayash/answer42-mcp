[project]
name = "mcp-1c-test-manager"
version = "0.1.0"
description = "MCP server for controlling 1C:Enterprise test clients through a 1C test manager bridge"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["mcp>=1.9.0", "websockets>=12.0", "pydantic>=2.0"]

[project.optional-dependencies]
screenshot = ["mss>=9.0.0"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
mcp-1c-test-manager = "mcp_1c.server:main"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_1c"]
