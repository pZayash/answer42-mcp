stages:
  - test
  - lint
  - package
  - deploy
  - publish

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  paths:
    - .cache/pip/

.python-job:
  image: python:3.13-slim
  before_script:
    - python -m pip install --upgrade pip
    - python -m pip install -e '.[dev]'

unit_tests:
  extends: .python-job
  stage: test
  script:
    - python -m py_compile src/mcp_1c/*.py src/mcp_1c/rag/*.py
    - python -m pytest -q -c /dev/null tests/test_credentials.py tests/test_protocol.py tests/test_server_tools.py

lint:
  extends: .python-job
  stage: lint
  needs: []
  allow_failure: false
  script:
    - python -m ruff check src/mcp_1c tests

# The XML sources are exported in an older 1C format only after they are made
# compatible with 8.3.27. This job is the release gate: the .cf files shipped
# in the wheel are always built by the pinned target platform, never by the
# developer's local platform.
build_cf_8_3_27:
  image:
    name: registry.gitlab.com/platform42/onec-docker/onec-ibsrv:8.3.27.2342
    entrypoint: [""]
  stage: package
  script:
    - |
      set -eu
      IBCMD=/opt/1cv8/x86_64/8.3.27.2342/ibcmd
      IB_DATA="$CI_PROJECT_DIR/.ci/ib-data"
      mkdir -p build/cf "$IB_DATA"
      "$IBCMD" --version
      "$IBCMD" infobase create --data="$IB_DATA" --db-path="$IB_DATA/db-data" --force
      "$IBCMD" config import --data="$IB_DATA" --db-path="$IB_DATA/db-data" --out=build/cf/MCPTestManager.cf src/cf
      rm -rf "$IB_DATA"
      "$IBCMD" infobase create --data="$IB_DATA" --db-path="$IB_DATA/db-data" --force
      "$IBCMD" config import --data="$IB_DATA" --db-path="$IB_DATA/db-data" --out=build/cf/MCPTestClient.cf src/client_cf
      test -s build/cf/MCPTestManager.cf
      test -s build/cf/MCPTestClient.cf
  artifacts:
    expire_in: 7 days
    paths:
      - build/cf/MCPTestManager.cf
      - build/cf/MCPTestClient.cf

package:
  extends: .python-job
  stage: package
  needs:
    - job: unit_tests
    - job: build_cf_8_3_27
      artifacts: true
  script:
    - install -m 644 build/cf/MCPTestManager.cf src/mcp_1c/assets/MCPTestManager.cf
    - install -m 644 build/cf/MCPTestClient.cf src/mcp_1c/assets/MCPTestClient.cf
    - test -s src/mcp_1c/assets/MCPTestManager.cf
    - test -s src/mcp_1c/assets/MCPTestClient.cf
    - test -s src/mcp_1c/assets/skills/answer42/SKILL.md
    - test -s src/mcp_1c/assets/skills/answer42-rag/SKILL.md
    - python -m pip install build twine
    - python -m build
    - python -m twine check dist/*
  artifacts:
    expire_in: 7 days
    paths:
      - dist/

pages:
  image: python:3.13-slim
  stage: deploy
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - python scripts/build_pages.py
  artifacts:
    paths:
      - public

publish_pypi:
  image: python:3.13-slim
  stage: publish
  needs: ["package"]
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+.*$/'
  before_script:
    - python -m pip install --upgrade pip twine
  script:
    - python -m twine upload --non-interactive -u __token__ -p "$PYPI_API_TOKEN" dist/*

create_gitlab_release:
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  stage: publish
  needs: ["publish_pypi"]
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+.*$/'
  script:
    - echo "Creating GitLab release for $CI_COMMIT_TAG"
    - NOTES_FILE="release-notes/${CI_COMMIT_TAG}.md"
    - |
      if [ -s "$NOTES_FILE" ]; then
        RELEASE_DESCRIPTION=$(cat "$NOTES_FILE")
      else
        echo "Release notes file $NOTES_FILE is missing; using autogenerated fallback."
        RELEASE_DESCRIPTION="Answer42 ${CI_COMMIT_TAG} release.\n\nCommit: ${CI_COMMIT_SHA}\nPyPI package was published by the preceding publish_pypi job."
      fi
    - release-cli create --name "Answer42 $CI_COMMIT_TAG" --tag-name "$CI_COMMIT_TAG" --ref "$CI_COMMIT_SHA" --description "$RELEASE_DESCRIPTION"
