stages:
  - test
  - package
  - deploy
  - publish

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  paths:
    - .cache/pip/

.python-job:
  image: python:3.13-slim
  before_script:
    - python -m pip install --upgrade pip
    - python -m pip install -e '.[dev]'

unit_tests:
  extends: .python-job
  stage: test
  script:
    - python -m py_compile src/mcp_1c/*.py src/mcp_1c/rag/*.py
    - python -m pytest -q -c /dev/null tests/test_credentials.py tests/test_protocol.py tests/test_server_tools.py
    - python -m ruff check src/mcp_1c tests

package:
  extends: .python-job
  stage: package
  needs: ["unit_tests"]
  script:
    - test -s src/mcp_1c/assets/MCPTestManager.cf
    - test -s src/mcp_1c/assets/MCPTestClient.cf
    - test -s src/mcp_1c/assets/skills/answer42/SKILL.md
    - test -s src/mcp_1c/assets/skills/answer42-rag/SKILL.md
    - python -m pip install build twine
    - python -m build
    - python -m twine check dist/*
  artifacts:
    expire_in: 7 days
    paths:
      - dist/

pages:
  image: python:3.13-slim
  stage: deploy
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - python scripts/build_pages.py
  artifacts:
    paths:
      - public

publish_pypi:
  image: python:3.13-slim
  stage: publish
  needs: ["package"]
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+.*$/'
  before_script:
    - python -m pip install --upgrade pip twine
  script:
    - python -m twine upload --non-interactive -u __token__ -p "$PYPI_API_TOKEN" dist/*

create_gitlab_release:
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  stage: publish
  needs: ["publish_pypi"]
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+.*$/'
  script:
    - echo "Creating GitLab release for $CI_COMMIT_TAG"
  release:
    tag_name: "$CI_COMMIT_TAG"
    name: "Answer42 $CI_COMMIT_TAG"
    description: |
      ## Исправления сохранения табличных документов

      - `tabular_document_save` теперь распознаёт результат отчёта, который test-client показывает как обычное `ТестируемоеПолеФормы` с представлением данных `ТабличныйДокумент`.
      - Для PDF используется `ЗаписатьСодержимоеВФайл(<СохранитьКак>)` через очередь результата файлового диалога, с проверкой обоих вариантов `СохранитьКак`.
      - Из-за несовпадения индексов фильтров test-client API с интерактивным порядком диалога PDF выбирается по сигнатуре файла `%PDF`, затем копируется в запрошенный `path`.
      - В результат tool добавлено поле `selected` с фактическими `filter_index`, `save_as` и `copied_to`.
      - В packaged wheel обновлён `MCPTestManager.cf`.

      ## Тесты

      - Проверено локально: сборка `MCPTestManager.cf`, `py_compile`, `pytest tests/test_server_tools.py`.
      - Проверено в живой 1С BP: отчёт `Остатки товаров` сохранён как настоящий `%PDF-1.7`.
      - В CI дополнительно выполняются `pytest`, `ruff`, сборка пакета и `twine check`.

      ## Установка

      ```bash
      pipx install answer42
      # или
      pip install answer42
      ```
